<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f3f4f6;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background:#ffffff;">
          <tr>
            <td bgcolor="#10b981" style="background-color:#10b981;padding:20px;border-radius:8px 8px 0 0;">
              <h1 style="margin:0;color:#ffffff;font-size:24px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;text-align:center;">Verification Code</h1>
            </td>
          </tr>
          <tr>
            <td bgcolor="#f9fafb" style="background-color:#f9fafb;padding:20px;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 8px 8px;">
              <p style="margin:0 0 16px 0;font-size:16px;color:#111827;line-height:1.5;">You requested to sign in. Please use the verification code below:</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:20px 0;">
                <tr>
                  <td bgcolor="#ffffff" style="background-color:#ffffff;padding:20px;border-radius:8px;text-align:center;font-size:32px;font-weight:bold;color:#10b981;letter-spacing:8px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">{{ .Token }}</td>
                </tr>
              </table>
              <p style="margin:0 0 12px 0;font-size:16px;color:#111827;line-height:1.5;">This code will expire shortly.</p>
              <p style="margin:0;font-size:16px;color:#111827;line-height:1.5;">If you didn't request this code, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 8px 0;text-align:center;color:#6b7280;font-size:14px;">
              <p style="margin:0;">This is an automated message. Please do not reply to this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
