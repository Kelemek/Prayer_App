<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <!-- Viewport meta for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="description" content="Prayer App — submit prayer requests, follow community prayers, and stay connected with your church community." />
    <!-- Align browser chrome/safe-area color with header background instead of green brand color -->
    <meta name="theme-color" content="#F8F7F5" />
    <script>
      // Run before first paint. iOS paints the top and bottom safe areas from the
      // WebView canvas, which stays white unless color-scheme is already dark.
      (function() {
        var theme = localStorage.getItem('theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
        var root = document.documentElement;
        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', isDark ? '#111827' : '#F8F7F5');
        }
      })();
    </script>

    <!-- Inline critical CSS for faster FCP -->
    <style>
      html { background-color: #F8F7F5; color-scheme: light; }
      html.dark { background-color: #111827; color-scheme: dark; }
      body { background-color: #F8F7F5; margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
      html.dark body { background-color: #111827; }
      /* Cover the notch and home-indicator bands before the main stylesheet loads. */
      body::before,
      body::after {
        content: '';
        position: fixed;
        left: 0;
        right: 0;
        z-index: 9999;
        background-color: #F8F7F5;
        pointer-events: none;
      }
      body::before { top: 0; height: env(safe-area-inset-top, 0px); }
      body::after { bottom: 0; height: env(safe-area-inset-bottom, 0px); }
      html.dark body::before,
      html.dark body::after { background-color: #111827; }

      /* Prevent iOS zoom on input focus */
      input[type="text"], input[type="email"], textarea, select {
        font-size: 16px;
      }
    </style>
    <title>Prayer App</title>
    <script>
      // Load cached logo URLs immediately to prevent flash (tenant-scoped)
      (function() {
        const tenantId = localStorage.getItem('active_tenant_id');
        const suffix = tenantId ? ':' + tenantId : '';
        const lightLogo = localStorage.getItem('branding_light_logo' + suffix);
        const darkLogo = localStorage.getItem('branding_dark_logo' + suffix);
        const useLogo = localStorage.getItem('branding_use_logo' + suffix);
        
        if (lightLogo || darkLogo || useLogo) {
          // Store in window object for Angular to access instantly
          window.__cachedLogos = {
            tenantId: tenantId,
            light: lightLogo,
            dark: darkLogo,
            useLogo: useLogo === 'true'
          };
          
          // Add link preload hints for cached logos
          // This tells browser to prioritize loading these images if they're data URLs
          if (lightLogo && lightLogo.startsWith('data:')) {
            const lightLink = document.createElement('link');
            lightLink.rel = 'preload';
            lightLink.as = 'image';
            lightLink.href = lightLogo;
            lightLink.media = '(prefers-color-scheme: light)';
            document.head.appendChild(lightLink);
          }
          
          if (darkLogo && darkLogo.startsWith('data:')) {
            const darkLink = document.createElement('link');
            darkLink.rel = 'preload';
            darkLink.as = 'image';
            darkLink.href = darkLogo;
            darkLink.media = '(prefers-color-scheme: dark)';
            document.head.appendChild(darkLink);
          }
        }
      })();

      // Mark native Capacitor app so we can scope safe-area behavior
      (function() {
        try {
          if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) {
            document.documentElement.classList.add('native-app');
          }
        } catch (e) {
          // Ignore - defaults to web behavior
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
