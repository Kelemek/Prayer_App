<!-- Filter-style preview tabs (mock of home filters): Church, Groups, Personal, Memorize -->
<div class="flex w-full gap-1 mb-0">
  @if (canAccessShared) {
  <div
    class="relative z-20 flex-1 min-w-0"
    role="button"
    tabindex="0"
    (click)="selectPublicPreviewTab()"
    (keydown.enter)="selectPublicPreviewTab()"
    (keydown.space)="selectPublicPreviewTab(); $event.preventDefault()"
  >
    <div [class]="publicTabClass() + ' w-full'">Church</div>
    <button
      type="button"
      (click)="$event.stopPropagation(); openBadges.emit()"
      class="absolute -top-2 -right-2 z-20 inline-flex items-center justify-center w-6 h-6 bg-[#39704D] dark:bg-[#39704D] text-white rounded-full text-xs font-bold hover:bg-[#2d5a3f] dark:hover:bg-[#2d5a3f] focus:outline-none focus:ring-2 focus:ring-[#39704D] focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition-colors cursor-pointer"
      title="About badges"
      aria-label="About badges"
    >
      1
    </button>
  </div>
  }
  @if (canAccessGroupsTab) {
  <button
    type="button"
    (click)="setPreviewFilter('groups')"
    [class]="groupsTabClass()"
  >
    Groups
  </button>
  }
  <button
    type="button"
    (click)="setPreviewFilter('personal')"
    [class]="personalTabClass()"
  >
    Personal
  </button>
  <button
    type="button"
    id="tour-filter-memorize"
    (click)="setPreviewFilter('memorize')"
    [class]="memorizeTabClass()"
  >
    Memorize
  </button>
</div>

@if (canAccessShared && isPublicAreaActive()) {
<div>
  <div [class]="publicPanelGroupClass()">
    <div [class]="publicChipRowClass">
      <div [class]="publicChipHostClass">
        <button
          type="button"
          (click)="setPreviewFilter('current')"
          [class]="subFilterChipClass('current')"
        >
          Current (22)
        </button>
      </div>
      <div [class]="publicChipHostClass">
        <button
          type="button"
          (click)="setPreviewFilter('answered')"
          [class]="subFilterChipClass('answered')"
        >
          Answered (4)
        </button>
      </div>
      <div [class]="publicChipHostClass">
        <button
          type="button"
          (click)="setPreviewFilter('archived')"
          [class]="subFilterChipClass('archived')"
        >
          Archived (21)
        </button>
      </div>
    </div>
    <div [class]="publicChipRowClass + ' mt-2'">
      <div [class]="publicChipHostClass">
        <button
          type="button"
          (click)="setPreviewFilter('total')"
          [class]="subFilterChipClass('total')"
        >
          Total (47)
        </button>
      </div>
      <div [class]="publicChipHostClass">
        <button
          type="button"
          id="tour-filter-prompts"
          (click)="setPreviewFilter('prompts')"
          [class]="subFilterChipClass('prompts')"
        >
          Prompts (12)
        </button>
      </div>
    </div>
  </div>

  <div
    class="overflow-hidden transition-[max-height,opacity] duration-300 ease-out"
    [class.max-h-0]="previewFilter !== 'prompts'"
    [class.opacity-0]="previewFilter !== 'prompts'"
    [class.max-h-48]="previewFilter === 'prompts'"
    [class.opacity-100]="previewFilter === 'prompts'"
    [class.pointer-events-none]="previewFilter !== 'prompts'"
    [attr.aria-hidden]="previewFilter !== 'prompts'"
  >
    <app-info-home-filter-preview-prompts-filters
      [attachedUnderPublic]="true"
      (openPromptCategories)="openPromptCategories.emit()"
    />
  </div>
</div>
}

@if (previewFilter === 'groups') {
<div>
  <div [class]="groupsPanelGroupClass() + ' ' + chipRowClass">
    <button type="button" [class]="groupAddChipClass()">Add</button>
    <div [class]="chipHostClass">
      <button type="button" [class]="groupChipClass(true)">Current (3)</button>
    </div>
    <div [class]="chipHostClass">
      <button type="button" [class]="groupChipClass(false)">Answered (1)</button>
    </div>
    <div [class]="chipHostClass">
      <button type="button" [class]="groupChipClass(false)">Total (4)</button>
    </div>
  </div>
  <div [class]="groupsPanelGroupClass() + ' ' + chipRowClass + ' mt-2'">
    <div [class]="chipHostClass">
      <button type="button" [class]="groupChipClass(false)">Family (2)</button>
    </div>
  </div>
</div>
}

@if (previewFilter === 'personal') {
<app-info-home-filter-preview-personal-filters
  (openPersonalCategories)="openPersonalCategories.emit()"
/>
}

@if (previewFilter === 'memorize') {
<div>
  <div [class]="memorizePanelGroupClass() + ' ' + chipRowClass">
    <div [class]="chipHostClass">
      <button
        type="button"
        [class]="memorizeChipClass(true)"
        (click)="openMemorizeAction.emit('add-verses')"
      >
        Add Verses
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        [class]="memorizeChipClass(false)"
        (click)="openMemorizeAction.emit('bible-books')"
      >
        Bible Books
      </button>
    </div>
    <div [class]="chipHostClass">
      <button
        type="button"
        [class]="memorizeChipClass(false)"
        (click)="openMemorizeAction.emit('recommended')"
      >
        Recommended
      </button>
    </div>
  </div>
</div>
}
