<div [class]="sectionGapClass">
  <div [class]="subFilterGroupClass + ' ' + chipRowClass">
    @if (canCreateGroups) {
    <div [class]="chipHostClass">
      <app-home-sub-filter-chip
        chipId="tour-filter-add-group"
        class="w-full"
        [active]="false"
        [stretch]="false"
        [layoutClass]="chipButtonClass"
        [activeClass]="chipThemes.members.active"
        [inactiveClass]="chipThemes.members.inactive"
        (chipClick)="addGroup.emit()"
      >
        Add Group
      </app-home-sub-filter-chip>
    </div>
    } @else if (showProUpgrade) {
    <div [class]="chipHostClass">
      <app-home-sub-filter-chip
        chipId="tour-filter-upgrade-pro"
        class="w-full"
        [active]="false"
        [stretch]="false"
        [layoutClass]="chipButtonClass"
        [activeClass]="chipThemes.members.active"
        [inactiveClass]="chipThemes.members.inactive"
        (chipClick)="upgradePro.emit()"
      >
        Upgrade to Pro
      </app-home-sub-filter-chip>
    </div>
    }
    @for (group of groups; track group.id) {
    <div [class]="chipHostClass">
      <div [class]="chipShellClass(group)">
        <button
          type="button"
          [id]="'tour-filter-group-' + group.id"
          class="min-w-0 flex-1 truncate border-0 bg-transparent px-2 text-center text-xs font-medium text-inherit cursor-pointer"
          (click)="selectGroup.emit(group.id)"
        >
          {{ group.name }}
        </button>
        <app-card-actions-overflow-menu
          [items]="overflowItems(group)"
          bandSize="sm"
        />
      </div>
    </div>
    }
  </div>
</div>

@if (renameTarget) {
<div
  class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-50 p-4"
  (click)="cancelRename()"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-lg max-w-md w-full modal-panel-edge"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 modal-chrome-header">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">
        Rename group
      </h2>
    </div>
    <div class="px-6 py-4">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
        Group name
        <input
          type="text"
          class="mt-1 w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
          [(ngModel)]="renameDraft"
          (keydown.enter)="saveRename()"
          [disabled]="groupActionSubmitting"
        />
      </label>
    </div>
    <div class="px-6 py-4 modal-chrome-footer flex gap-3 justify-end">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-medium cursor-pointer"
        (click)="cancelRename()"
        [disabled]="groupActionSubmitting"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-md btn-chip btn-chip-blue cursor-pointer disabled:opacity-50"
        (click)="saveRename()"
        [disabled]="groupActionSubmitting || !canSaveRename()"
      >
        {{ groupActionSubmitting ? "Saving…" : "Save" }}
      </button>
    </div>
  </div>
</div>
}

<app-home-group-members-modal
  [isOpen]="!!membersTarget"
  [group]="membersTarget"
  [currentUserEmail]="currentUserEmail"
  [maxMembersPerGroup]="maxMembersPerGroup"
  [submitting]="groupActionSubmitting"
  (close)="closeManageMembers()"
  (groupsChanged)="groupsChanged.emit()"
/>

@if (pendingDeleteGroup) {
<app-confirmation-dialog
  title="Delete group?"
  [message]="deleteConfirmMessage()"
  confirmText="Delete"
  [isDangerous]="true"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()"
/>
}
