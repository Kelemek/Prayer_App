<div [class]="sectionGapClass">
  <div [class]="subFilterGroupClass">
    <div
      cdkDropList
      cdkDropListOrientation="mixed"
      [cdkDropListData]="groups"
      (cdkDropListDropped)="onGroupDrop($event)"
      [cdkDropListDisabled]="isGroupReordering || groups.length === 0"
      [class]="chipRowClass"
    >
      @if (canCreateGroups) {
      <div [class]="chipHostClass">
        <app-home-sub-filter-chip
          chipId="tour-filter-add-group"
          [active]="false"
          [layoutClass]="chipButtonClass"
          [activeClass]="chipThemes.members.active"
          [inactiveClass]="chipThemes.members.inactive"
          (chipClick)="addGroup.emit()"
        >
          Add Group
        </app-home-sub-filter-chip>
      </div>
      } @else if (showProUpgrade) {
      <div [class]="chipHostClass">
        <app-home-sub-filter-chip
          chipId="tour-filter-upgrade-pro"
          [active]="false"
          [layoutClass]="chipButtonClass"
          [activeClass]="chipThemes.members.active"
          [inactiveClass]="chipThemes.members.inactive"
          (chipClick)="upgradePro.emit()"
        >
          Upgrade to Pro
        </app-home-sub-filter-chip>
      </div>
      }

      @for (group of groups; track group.id) {
      <div
        cdkDrag
        [cdkDragData]="group"
        [attr.data-group-filter-chip]="group.id"
        [cdkDragDisabled]="isGroupReordering"
        (cdkDragStarted)="onGroupDragStarted()"
        (cdkDragEnded)="onGroupDragEnded()"
        [class]="chipHostClass"
      >
        <div [class]="chipShellClass(group)">
          <span
            cdkDragHandle
            data-group-filter-drag-handle
            class="absolute inset-y-0 left-0 flex w-7 items-center justify-center"
            aria-hidden="true"
            (pointerdown)="$event.stopPropagation()"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [class]="
                'pointer-events-none flex-shrink-0 ' +
                (isGroupReordering ? 'cursor-not-allowed' : 'cursor-grab')
              "
            >
              <circle cx="9" cy="5" r="1"></circle>
              <circle cx="9" cy="12" r="1"></circle>
              <circle cx="9" cy="19" r="1"></circle>
              <circle cx="15" cy="5" r="1"></circle>
              <circle cx="15" cy="12" r="1"></circle>
              <circle cx="15" cy="19" r="1"></circle>
            </svg>
          </span>
          <button
            type="button"
            [id]="'tour-filter-group-' + group.id"
            class="min-w-0 flex-1 truncate border-0 bg-transparent px-2 text-center text-xs font-medium text-inherit cursor-pointer"
            (click)="selectGroup.emit(group.id)"
            [disabled]="isGroupReordering"
          >
            {{ group.name }}
            @if (isGroupReordering) {
            <svg
              class="ml-1 inline h-4 w-4 shrink-0 animate-spin"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            }
          </button>
          <span
            class="inline-flex h-9 shrink-0 items-center"
            (pointerdown)="$event.stopPropagation()"
          >
            <app-card-actions-overflow-menu
              [items]="overflowItems(group)"
              bandSize="sm"
            />
          </span>
        </div>
      </div>
      }
    </div>
  </div>
</div>

@if (renameTarget) {
<div
  class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-50 p-4"
  (click)="cancelRename()"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-lg max-w-md w-full modal-panel-edge"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 modal-chrome-header">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">
        Rename group
      </h2>
    </div>
    <div class="px-6 py-4">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
        Group name
        <input
          type="text"
          class="mt-1 w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
          [(ngModel)]="renameDraft"
          (keydown.enter)="saveRename()"
          [disabled]="groupActionSubmitting"
        />
      </label>
    </div>
    <div class="px-6 py-4 modal-chrome-footer flex gap-3 justify-end">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 font-medium cursor-pointer"
        (click)="cancelRename()"
        [disabled]="groupActionSubmitting"
      >
        Cancel
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-md btn-chip btn-chip-blue cursor-pointer disabled:opacity-50"
        (click)="saveRename()"
        [disabled]="groupActionSubmitting || !canSaveRename()"
      >
        {{ groupActionSubmitting ? "Saving…" : "Save" }}
      </button>
    </div>
  </div>
</div>
}

<app-home-group-members-modal
  [isOpen]="!!membersTarget"
  [group]="membersTarget"
  [currentUserEmail]="currentUserEmail"
  [maxMembersPerGroup]="maxMembersPerGroup"
  [submitting]="groupActionSubmitting"
  (close)="closeManageMembers()"
  (groupsChanged)="groupsChanged.emit()"
/>

@if (pendingDeleteGroup) {
<app-confirmation-dialog
  title="Delete group?"
  [message]="deleteConfirmMessage()"
  confirmText="Delete"
  [isDangerous]="true"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()"
/>
}
