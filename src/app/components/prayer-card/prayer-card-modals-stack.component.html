<app-prayer-add-update-modal
  [isOpen]="showAddUpdateForm"
  [prayerId]="prayerId"
  [isPersonal]="isPersonal"
  [richTextEditorsEnabled]="richTextEditorsEnabled"
  [tourElementIds]="addUpdateTourElementIds"
  (close)="closeAddUpdate.emit()"
  (submit)="addUpdateSubmit.emit($event)"
/>

<app-prayer-delete-request-modal
  [isOpen]="showDeleteRequestForm || showUpdateDeleteRequestForm !== null"
  [prayerId]="prayerId"
  [requestType]="showUpdateDeleteRequestForm ? 'update' : 'prayer'"
  [updateId]="showUpdateDeleteRequestForm ?? ''"
  (close)="closeDeleteRequest.emit()"
  (submit)="deleteRequestSubmit.emit($event)"
/>

@if (showConfirmationDialog) {
  <app-confirmation-dialog
    [title]="'Delete Prayer'"
    [message]="'Are you sure you want to delete this prayer? This action cannot be undone.'"
    [isDangerous]="true"
    [confirmText]="'Delete'"
    (confirm)="confirmDelete.emit()"
    (cancel)="cancelDelete.emit()"
  />
}

@if (showUpdateConfirmationDialog) {
  <app-confirmation-dialog
    [title]="updateConfirmationTitle"
    [message]="updateConfirmationMessage"
    [isDangerous]="true"
    [confirmText]="'Delete'"
    (confirm)="confirmUpdateDelete.emit()"
    (cancel)="cancelUpdateDelete.emit()"
  />
}

@if (showShareModal) {
  <app-confirmation-dialog
    [title]="'Share Prayer?'"
    [message]="'A copy of your prayer will be submitted for admin approval to share publicly.'"
    [details]="'Your personal prayer stays in your private list. When approved, it will also appear on the main prayer board for the church to lift up in prayer.'"
    [isDangerous]="false"
    [confirmText]="'Share Prayer'"
    [cancelText]="'Cancel'"
    (confirm)="confirmShare.emit()"
    (cancel)="cancelShare.emit()"
  />
}

<app-personal-prayer-answered-status-modal
  [isOpen]="personalAnsweredStatusModalMode !== null"
  [mode]="personalAnsweredStatusModalMode ?? 'mark'"
  (close)="closePersonalAnsweredStatus.emit()"
  (confirmMark)="confirmPersonalAnswered.emit()"
  (confirmUnmark)="confirmPersonalUnanswered.emit($event)"
/>

<app-prayer-card-pray-for-modal
  [isOpen]="showPrayForModal"
  [isPersonal]="isPersonal"
  [usesPersonalCooldown]="usesPersonalCooldown"
  (confirm)="confirmPrayFor.emit($event)"
  (cancel)="cancelPrayFor.emit()"
/>
