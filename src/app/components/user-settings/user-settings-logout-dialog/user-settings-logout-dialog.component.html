@if (host.showLogoutVerification) {
<div
  appTopChromeOverlay
  class="fixed inset-0 bg-gray-900/50 flex items-start sm:items-center justify-center z-[60] p-4 safe-area-overlay"
  (click)="host.closeLogoutVerification()"
>
  <div
    class="bg-white dark:bg-gray-800 rounded-lg shadow-lg max-w-md w-full modal-panel-edge"
    role="dialog"
    aria-labelledby="settings-logout-title"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="px-6 py-4 modal-chrome-header">
      <h2
        id="settings-logout-title"
        class="text-lg font-semibold text-gray-900 dark:text-gray-100"
      >
        Log out?
      </h2>
    </div>
    <div class="px-6 py-4">
      <p class="text-gray-600 dark:text-gray-300">
        Are you sure you want to sign out?
      </p>
    </div>
    <div
      class="px-6 py-4 modal-chrome-footer flex flex-col-reverse sm:flex-row gap-3 sm:justify-end"
    >
      <button
        type="button"
        (click)="host.closeLogoutVerification()"
        class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors font-medium cursor-pointer"
      >
        Cancel
      </button>
      <button
        type="button"
        (click)="host.confirmLogout()"
        class="px-4 py-2 rounded-md btn-chip btn-chip-green"
      >
        Log out
      </button>
    </div>
  </div>
</div>
}
