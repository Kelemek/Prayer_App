      <!-- Theme Selector -->
      <div
        id="tour-settings-theme"
        class="settings-modal-section-card rounded-lg p-3 sm:p-4"
      >
        <div class="flex items-start gap-2 sm:gap-3">
          <div class="flex-1">
            <div
              class="font-medium text-gray-800 dark:text-gray-100 mb-3 text-sm sm:text-base"
            >
              Theme Preference
            </div>
            <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
              <button
                (click)="themeChange.emit('light')"
                [ngClass]="choiceState(theme === 'light')"
                title="Use light theme for the application"
                [class]="choiceBtnClass"
              >
                <svg
                  width="18"
                  height="18"
                  class="text-amber-600 sm:w-5 sm:h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span
                  class="text-xs sm:text-sm font-medium text-gray-800 dark:text-gray-100"
                  >Light</span
                >
              </button>
              <button
                (click)="themeChange.emit('dark')"
                [ngClass]="choiceState(theme === 'dark')"
                title="Use dark theme for the application"
                [class]="choiceBtnClass"
              >
                <svg
                  width="18"
                  height="18"
                  class="text-blue-600 dark:text-blue-400 sm:w-5 sm:h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  ></path>
                </svg>
                <span
                  class="text-xs sm:text-sm font-medium text-gray-800 dark:text-gray-100"
                  >Dark</span
                >
              </button>
              <button
                (click)="themeChange.emit('system')"
                [ngClass]="choiceState(theme === 'system')"
                title="Use your operating system's theme preference"
                [class]="choiceBtnClass"
              >
                <svg
                  width="18"
                  height="18"
                  class="text-gray-600 dark:text-gray-400 sm:w-5 sm:h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect
                    x="2"
                    y="3"
                    width="20"
                    height="14"
                    rx="2"
                    ry="2"
                  ></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span
                  class="text-xs sm:text-sm font-medium text-gray-800 dark:text-gray-100"
                  >System</span
                >
              </button>
            </div>
            <p
              class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mt-2 text-pretty"
            >
              Choose your preferred color theme or use your system settings
            </p>
          </div>
        </div>
      </div>

      <!-- Text size -->
      <div
        id="tour-settings-text-size"
        class="settings-modal-section-card rounded-lg p-3 sm:p-4"
      >
        <div class="flex items-start gap-2 sm:gap-3">
          <div class="flex-1">
            <div
              class="font-medium text-gray-800 dark:text-gray-100 mb-3 text-sm sm:text-base"
            >
              Text size
            </div>
            <div class="grid grid-cols-3 gap-1.5 sm:gap-2">
              <button
                (click)="textSizeChange.emit('normal')"
                [ngClass]="choiceState(textSize === 'normal')"
                title="Default text size"
                [class]="choiceBtnClass"
              >
                <span
                  class="text-xs sm:text-sm font-medium text-gray-800 dark:text-gray-100"
                  >Default</span
                >
              </button>
              <button
                (click)="textSizeChange.emit('large')"
                [ngClass]="choiceState(textSize === 'large')"
                title="Larger text"
                [class]="choiceBtnClass"
              >
                <span
                  class="text-sm sm:text-base font-medium text-gray-800 dark:text-gray-100"
                  >Larger</span
                >
              </button>
              <button
                (click)="textSizeChange.emit('largest')"
                [ngClass]="choiceState(textSize === 'largest')"
                title="Largest text"
                [class]="choiceBtnClass"
              >
                <span
                  class="text-base font-medium text-gray-800 dark:text-gray-100"
                  >Largest</span
                >
              </button>
            </div>
            <p
              class="text-xs sm:text-sm text-gray-600 dark:text-gray-400 mt-2 text-pretty"
            >
              Make on-screen text larger for easier reading
            </p>
          </div>
        </div>
      </div>
