<div [class]="shellClasses">
  <app-card-meta-header-band
    layout="three-column"
    [centerDate]="headerDateParts.date"
    [centerTime]="headerDateParts.time"
    [compactActionsInset]="true"
  >
    <div cardMetaLeft class="w-full min-w-0">
      <span
        class="personal-category-header-band flex h-full w-full min-w-0 max-w-full items-center font-bold overflow-hidden"
        [class]="headerInsetClasses + ' ' + headerTextClasses"
        [ngStyle]="categoryStyles"
      >
        <span class="min-w-0 truncate">{{ category }}</span>
      </span>
    </div>
    <div cardMetaRight class="flex items-center justify-end">
      <app-card-actions-overflow-menu [items]="overflowItems" />
    </div>
  </app-card-meta-header-band>

  <div [class]="'flex items-start justify-between relative ' + layout.headerRowMargin">
    <h3 [class]="layout.titleClasses">Prayer for Riley</h3>
  </div>
  <p [class]="layout.descriptionClasses">
    Give every person a private list of their own prayers that only they can see
    and update.
  </p>
  <p class="text-xs text-gray-500 dark:text-gray-500">
    Personal prayers never appear on the public list, but they live in the same
    simple interface. Organize with categories and reorder by dragging.
  </p>
</div>
