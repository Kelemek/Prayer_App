name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Tests only. The previous job commented on the PR and 403'd
# ("Resource not accessible by integration"). That comment always said
# "all passed" and did not read the coverage artifact.
permissions:
  contents: read

jobs:
  test:
    # Ubuntu only. The app ships on Linux (Vercel). macOS and Windows jobs
    # ran `npm test`, which is watch-mode vitest and never exits.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint is not a CI step. angular.json has no lint target, and
      # eslint.config.js still imports React plugins that are not installed.
      # `npm run lint` exits 1 with that explanation. Do not paper over it
      # with continue-on-error.

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
